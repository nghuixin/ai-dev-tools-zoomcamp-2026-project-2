# Ships the API's JSON request logs (stdout) to Loki. Only containers labelled logging=promtail.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            severity: severity
            record_type: record_type
      # Low-cardinality labels only; the trace_id stays in the line and Grafana links it to Tempo.
      - labels:
          severity:
          record_type:
