apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      # From a trace, jump to its log lines.
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{service="api"} |= "$${__trace.traceId}"'

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      # From a log line, jump to its trace.
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"trace_id": "(\w+)"'
          url: "$${__value.raw}"
